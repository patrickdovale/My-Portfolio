name: Portfolio build

on:
  push:
    branches:
      - feat/portfolio-profissional-2026
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Resolve lockfile for the migration
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit lockfile to the migration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/portfolio-profissional-2026'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate Vite package lock [skip ci]"
            git push origin HEAD:feat/portfolio-profissional-2026
          fi
